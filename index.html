<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N2 單字互動練習</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#202733;--muted:#6b7280;--primary:#4f46e5;--primary2:#6366f1;--good:#15803d;--bad:#dc2626;--line:#e5e7eb;--shadow:0 12px 35px rgba(31,41,55,.09)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:var(--text);min-height:100vh}
.container{width:min(900px,92%);margin:0 auto;padding:28px 0 40px}.header{margin-bottom:20px}.header h1{margin:0 0 6px;font-size:clamp(26px,5vw,38px)}.header p{margin:0;color:var(--muted)}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}.stats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px}.pill b{color:var(--primary)}
.card{background:var(--card);border:1px solid rgba(229,231,235,.8);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,5vw,38px)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:28px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0;transition:.25s}
.badge{display:inline-block;background:#eef2ff;color:var(--primary);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:14px}
.word{text-align:center;margin:6px 0 26px}.word .jp{font-size:clamp(38px,9vw,64px);font-weight:800;letter-spacing:.04em}.word .reading{font-size:20px;color:var(--muted);margin-top:5px}
.question{font-size:18px;font-weight:700;margin:20px 0 10px}.hint{color:var(--muted);background:#f8fafc;border-radius:10px;padding:9px 12px;margin-bottom:13px;font-size:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:2px solid var(--line);background:#fff;border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;cursor:pointer;transition:.18s;min-height:58px}.option:hover:not(:disabled){border-color:#a5b4fc;background:#f5f3ff;transform:translateY(-1px)}.option:disabled{cursor:default}.option.correct{border-color:#22c55e;background:#f0fdf4;color:var(--good)}.option.wrong{border-color:#ef4444;background:#fef2f2;color:var(--bad)}
.feedback{margin-top:18px;border-radius:14px;padding:14px 16px;line-height:1.65;display:none}.feedback.show{display:block}.feedback.good{background:#f0fdf4;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}.example{margin-top:8px;color:#374151}
.actions{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}.btn.primary{background:var(--primary);color:white}.btn.primary:hover{background:#4338ca}.btn.secondary{background:#eef2f7;color:#374151}.btn:disabled{opacity:.45;cursor:not-allowed}
.result{text-align:center}.score{font-size:56px;font-weight:850;color:var(--primary);margin:10px 0}.result p{color:var(--muted)}.result .actions{justify-content:center;flex-wrap:wrap}
.footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:18px}
@media(max-width:600px){.container{padding-top:18px}.options{grid-template-columns:1fr}.card{border-radius:18px}.topbar{align-items:flex-start}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>JLPT N2 單字互動練習</h1>
    <p>500 個 N2 經典單字・四選一・即時解析</p>
  </div>
  <div class="topbar">
    <div class="stats">
      <div class="pill">題數 <b id="qnum">1 / 20</b></div>
      <div class="pill">答對 <b id="score">0</b></div>
      <div class="pill">正確率 <b id="accuracy">0%</b></div>
    </div>
    <button class="btn secondary" id="restartTop">重新開始</button>
  </div>
  <main id="app"></main>
  <div class="footer">離線網頁・不需安裝・可直接用瀏覽器開啟</div>
</div>

  $("qnum").textContent=`${Math.min(index+1,TOTAL)} / ${TOTAL}`;
  $("score").textContent=score;
  $("accuracy").textContent=(index===0?"0":Math.round(score/index*100))+"%";
}
function renderQuestion(){
  answered=false; updateStats();
  const item=quiz[index];
  const distractors=shuffle(WORDS.filter(x=>x.word!==item.word)).slice(0,3).map(x=>x.reading);
  const options=shuffle([item.reading,...distractors]);
  $("app").innerHTML=`
    <section class="card">
      <div class="progress"><i style="width:${index/TOTAL*100}%"></i></div>
      <div class="badge">第 ${index+1} 題</div>
      <div class="word"><div class="jp">${item.meaning}</div><div class="reading">請選出正確的日文讀音</div></div>
      <div class="question">「${item.meaning}」的日文讀音是哪一個？</div>
      <div class="hint">漢字提示：<strong>${item.word}</strong></div>
      <div class="options">${options.map((o,i)=>`<button class="option" data-answer="${encodeURIComponent(o)}">${String.fromCharCode(65+i)}．${o}</button>`).join("")}</div>
      <div id="feedback" class="feedback"></div>
      <div class="actions"><button class="btn primary" id="next" disabled>${index===TOTAL-1?"查看成績":"下一題 →"}</button></div>
    </section>`;
  document.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>answer(btn,item)));
  $("next").addEventListener("click",nextQuestion);
}
function answer(btn,item){
  if(answered)return;
  answered=true;
  const chosen=decodeURIComponent(btn.dataset.answer);
  const correct=chosen===item.reading;
  if(correct)score++;
  document.querySelectorAll(".option").forEach(b=>{
    const val=decodeURIComponent(b.dataset.answer);
    b.disabled=true;
    if(val===item.reading)b.classList.add("correct");
    if(val===chosen&&!correct)b.classList.add("wrong");
  });
  const f=$("feedback");
  f.className="feedback show "+(correct?"good":"bad");
  f.innerHTML=correct
    ? `✓ 答對了！<strong>${item.word}</strong>＝${item.reading}（${item.meaning}）<div class="example">例句：${item.example}</div>`
    : `✗ 答錯了。正確答案是 <strong>${item.reading}</strong>（${item.word}）<div class="example">例句：${item.example}</div>`;
  $("next").disabled=false; updateStats();
}
function nextQuestion(){
  if(!answered)return;
  index++;
  if(index>=TOTAL)return renderResult();
  renderQuestion();
}
function renderResult(){
  $("qnum").textContent=`${TOTAL} / ${TOTAL}`;
  $("score").textContent=score;
  $("accuracy").textContent=Math.round(score/TOTAL*100)+"%";
  $("app").innerHTML=`
    <section class="card result">
      <div class="badge">測驗完成</div>
      <h2>本次成績</h2>
      <div class="score">${score} / ${TOTAL}</div>
      <p>正確率：${Math.round(score/TOTAL*100)}%</p>
      <p>${score>=18?"太棒了！N2 單字掌握得很好。":score>=14?"表現不錯，再複習錯題會更穩。":"建議把錯題整理起來，多看幾次例句。"} </p>
      <div class="actions">
        <button class="btn primary" id="again">再測一次</button>
        <button class="btn secondary" id="all">繼續挑戰 500 字</button>
      </div>
    </section>`;
  $("again").onclick=makeQuiz;
  $("all").onclick=()=>{TOTAL_MODE=true;makeLongQuiz()};
}
let TOTAL_MODE=false;
function makeLongQuiz(){
  quiz=shuffle(WORDS); index=0; score=0; TOTAL=quiz.length; renderQuestion();
}
 $("restartTop").onclick=()=>{TOTAL_MODE=false;TOTAL=20;makeQuiz()};
makeQuiz();
</script>
</body>
</html>
